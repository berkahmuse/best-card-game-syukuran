<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lantern Row — Festival of Nine Lights</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #14102a; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Lantern Row: a market-draft card game. Take lantern cards, meld sets and runs, and reach 40 points before Madame Lumen."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
